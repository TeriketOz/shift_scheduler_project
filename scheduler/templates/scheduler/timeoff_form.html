{% extends "scheduler/base.html" %}
{% block content %}
<h3>Запрос отгула</h3>
<form method="post" class="row g-3" style="max-width:480px">
  {% csrf_token %}
  {% for field in form %}
    <div class="col-12">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
    </div>
  {% endfor %}
  {% if form.non_field_errors %}<div class="col-12 text-danger">{{ form.non_field_errors }}</div>{% endif %}
  <div class="col-12">
    <button class="btn btn-primary">Отправить</button>
    <a href="{% url 'scheduler:timeoff_list' %}" class="btn btn-link">Отмена</a>
  </div>
</form>
{% endblock %}
