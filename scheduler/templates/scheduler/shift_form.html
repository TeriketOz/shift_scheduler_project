{% extends "scheduler/base.html" %}
{% block content %}
<h3>{{ title }}</h3>
<form method="post" class="row g-3" style="max-width:640px">
  {% csrf_token %}
  {% for field in form %}
    <div class="col-md-6">
      <label class="form-label">{{ field.label }}</label>
      {{ field }}
      {% for e in field.errors %}<div class="text-danger small">{{ e }}</div>{% endfor %}
    </div>
  {% endfor %}
  <div class="col-12">
    <button class="btn btn-primary">Сохранить</button>
    <a href="{% url 'scheduler:shifts_list' %}" class="btn btn-link">Отмена</a>
  </div>
</form>
{% endblock %}
